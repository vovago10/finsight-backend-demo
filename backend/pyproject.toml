[project]
name = "pfm-backend-demo"
version = "0.1.0"
description = "Sanitized FastAPI personal finance backend demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.116.0,<0.137.0)",
    "uvicorn[standard] (>=0.35.0,<0.48.0)",
    "pydantic[email] (>=2.10.0,<3.0.0)",
    "pydantic-settings (>=2.10.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.40,<3.0.0)",
    "asyncpg (>=0.30.0,<0.32.0)",
    "alembic (>=1.16.0,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.20,<0.1.0)",
]

[dependency-groups]
dev = [
    "ruff (>=0.12.0,<0.16.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
